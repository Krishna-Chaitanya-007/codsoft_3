<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="overlay">
    <video id="bg-video" autoplay loop muted> 
      <source src="./bg_video.mp4" alt="Background Video" type="video/mp4">
    </video>
    <!-- <img src="bg.gif" alt="Background Video" id="bg-video"> -->
  </div>

  <div id="calculator-wrapper">
  <div id="calculator">
    <div id="display-container">
      <input type="text" id="display" width="auto" height="auto" disabled>
    </div>
    <div class="container">
      <button id="1" type="button" value="1" onclick="inputDisplay(event)" >1</button>
      <button id="2" type="button" value="2" onclick="inputDisplay(event)">2</button>
      <button id="3" type="button" value="3" onclick="inputDisplay(event)">3</button>
      <button id="+" class="operator" type="button" value="+" onclick="inputDisplay(event)">+</button>
      <button id="4" type="button" value="4" onclick="inputDisplay(event)">4</button>
      <button id="5" type="button" value="5" onclick="inputDisplay(event)">5</button>
      <button id="6" type="button" value="6" onclick="inputDisplay(event)">6</button>
      <button id="-" class="operator" type="button" value="-" onclick="inputDisplay(event)">-</button>
      <button id="7" type="button" value="7" onclick="inputDisplay(event)">7</button>
      <button id="8" type="button" value="8" onclick="inputDisplay(event)">8</button>
      <button id="9" type="button" value="9" onclick="inputDisplay(event)">9</button>
      <button id="*" class="operator" type="button" value="*" onclick="inputDisplay(event)">*</button>
      <button id="0" type="button" value="0" onclick="inputDisplay(event)">0</button>
    
      <button id="C" class="clear" type="button" value="C" onclick="inputDisplay(event)">C</button>
      <button id="=" class="operator" type="button" value="=" onclick="inputDisplay(event)">=</button>
      <button id="/" class="operator" type="button" value="/" onclick="inputDisplay(event)">/</button>
    </div>
  </div>
  <div id="controls">
  <label for="calc-color">Choose Calculator Color:</label>
  <input type="color" id="calc-color" value="#000000">
</div>

</div>
</body>
<script src="index.js"></script>
</html>
